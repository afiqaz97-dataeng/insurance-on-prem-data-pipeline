services:
  minio:
    # NOTE: MinIO stopped publishing to Docker Hub in Oct 2025 ("minio/minio" now
    # returns "pull access denied"). quay.io/minio/minio is still published — use that.
    image: quay.io/minio/minio:latest
    container_name: takaful-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
