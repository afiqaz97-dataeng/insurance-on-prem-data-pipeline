version: 2

sources:
  - name: raw
    description: >
      Raw landing zone in MinIO's raw-zone bucket, written by scripts/extract.py.
      Each table is partitioned by date (raw-zone/{table}/{yyyy-mm-dd}/{table}.csv);
      the glob below reads across all partitions written so far.
    tables:
      - name: participants
        meta:
          external_location: "s3://{{ env_var('MINIO_BUCKET_RAW', 'raw-zone') }}/participants/*/participants.csv"
      - name: policies
        meta:
          external_location: "s3://{{ env_var('MINIO_BUCKET_RAW', 'raw-zone') }}/policies/*/policies.csv"
      - name: contributions
        meta:
          external_location: "s3://{{ env_var('MINIO_BUCKET_RAW', 'raw-zone') }}/contributions/*/contributions.csv"
      - name: claims
        meta:
          external_location: "s3://{{ env_var('MINIO_BUCKET_RAW', 'raw-zone') }}/claims/*/claims.csv"
      - name: agency_transactions
        meta:
          external_location: "s3://{{ env_var('MINIO_BUCKET_RAW', 'raw-zone') }}/agency_transactions/*/agency_transactions.csv"
